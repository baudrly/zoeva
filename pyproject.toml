[project]
name = "zoeva"
version = "0.1.0"
description = "Sequence-annotation hypothesis generation with classical validation and annotation graphs"
requires-python = ">=3.9"
dependencies = [
  "biopython>=1.83",
  "pandas>=2.1",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "networkx>=3.2",
  "pyarrow>=15.0"
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7"]
report = ["weasyprint>=61.0"]
onnx = ["onnxruntime>=1.19"]

[project.scripts]
zoeva = "zoeva.cli:app"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
